[project]
name = "polylove-api"
version = "0.1.0"
description = "Polymarket intelligence and paper-trading assistant"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/polylove"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/api/python"]
pythonpath = ["apps/api"]
